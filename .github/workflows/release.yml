name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # F-Droid's auto-update reads versionName from the tagged commit, so they must match.
      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          test -f "fastlane/metadata/android/en-US/changelogs/$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle).txt" \
            || { echo "Missing Fastlane changelog for this versionCode" >&2; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release-keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "pssst-${GITHUB_REF_NAME}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pssst-${{ github.ref_name }}.apk
          generate_release_notes: true
