plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.herrderb.pssst'
    compileSdk 36

    defaultConfig {
        applicationId "com.herrderb.pssst"
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName "0.1.1"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Keep the APK reproducible for F-Droid: the git info file differs between checkouts.
            vcsInfo.include false
            // Unsigned when no keystore is provided (F-Droid signs its own builds).
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // F-Droid asks apps to drop AGP's encrypted dependency report, which only
    // Google can read, from the published artifacts.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('deploy', Exec) {
    description = 'Build debug APK, install on connected device, and launch the app'
    group = 'development'
    dependsOn 'installDebug'
    def adb = androidComponents.sdkComponents.adb
    doFirst { executable = adb.get().asFile.absolutePath }
    args 'shell', 'am', 'start', '-n', 'com.herrderb.pssst/com.herrderb.pssst.MainActivity'
}
